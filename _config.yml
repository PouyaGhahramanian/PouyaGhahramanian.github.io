# ---------------------------------------------------------------------------
# Site
# ---------------------------------------------------------------------------
title            : "Pouya Ghahramanian"
tagline          : "Machine learning on data that never stops arriving."
description      : >-
  Pouya Ghahramanian is a PhD researcher at Bilkent University working on
  machine learning for large-scale data streams — concept-drift adaptation,
  online learning, and continual adaptation of large language and time-series
  foundation models — and a data scientist building production demand
  forecasting systems.
url              : "https://pouya.ai"
baseurl          : ""
repository       : "PouyaGhahramanian/PouyaGhahramanian.github.io"
locale           : "en-US"
fonts_url        : "https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&family=IBM+Plex+Mono:wght@400;500&display=swap"
timezone         : "Europe/Istanbul"

# ---------------------------------------------------------------------------
# Author
# ---------------------------------------------------------------------------
author:
  name           : "Pouya Ghahramanian"
  short_name     : "Pouya"
  avatar         : "/images/pouya.jpg"
  role           : "PhD Researcher · Data Scientist"
  affiliation    : "Bilkent University"
  location       : "Ankara, Türkiye"
  email          : "pouyaghahramanian@gmail.com"
  github         : "PouyaGhahramanian"
  linkedin       : "pouyaghahramanian"
  scholar        : "https://scholar.google.com/citations?user=g4kmd_8AAAAJ"
  orcid          : ""
  twitter        : "___pouya___"

# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------
markdown         : kramdown
highlighter      : rouge
permalink        : /blog/:year/:month/:title/
future           : true
excerpt_separator: "\n\n"

kramdown:
  input          : GFM
  hard_wrap      : false
  auto_ids       : true
  smart_quotes   : lsquo,rsquo,ldquo,rdquo
  syntax_highlighter: rouge

sass:
  sass_dir       : _sass
  style          : compressed
  # We deliberately use @import (not @use): it keeps the stylesheet buildable by
  # the legacy github-pages/libsass toolchain as a fallback.
  silence_deprecations:
    - import

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from
  - jekyll-seo-tag

# Mirrors the plugin list for GitHub Pages' --safe mode.
whitelist:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from
  - jekyll-seo-tag

feed:
  path           : /feed.xml

# ---------------------------------------------------------------------------
# Collections
# ---------------------------------------------------------------------------
collections:
  publications:
    output       : true
    permalink    : /publications/:name/
  projects:
    output       : true
    permalink    : /projects/:name/

defaults:
  - scope:
      path       : ""
      type       : posts
    values:
      layout     : post
  - scope:
      path       : ""
      type       : publications
    values:
      layout     : publication
  - scope:
      path       : ""
      type       : projects
    values:
      layout     : project
  - scope:
      path       : ""
    values:
      layout     : page

# ---------------------------------------------------------------------------
# Files
# ---------------------------------------------------------------------------
include:
  - _pages
  - files

exclude:
  - docs
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - CONTRIBUTING.md
  - CHANGELOG.md
  - vendor
  - node_modules
  - package.json
  - package-lock.json
  - .github
  - scripts
  - "*.sublime-project"
  - "*.sublime-workspace"

keep_files:
  - .git
