<!doctype html>
<html data-theme="dark" lang="{{ site.locale | default: 'en' }}">
<head>
  {% include head.html %}
</head>
<body class="personal-home">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="personal-header">
    <a href="{{ '/' | relative_url }}" aria-label="Pouya, home">pouya.ai</a>
    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to light theme" title="Switch theme">
      <span class="theme-toggle__sun">{% include icon.html name="sun" %}</span>
      <span class="theme-toggle__moon">{% include icon.html name="moon" %}</span>
    </button>
  </header>
  <main id="main" class="personal-main">
    <section class="personal-intro" aria-labelledby="hello">
      <img class="personal-portrait" src="{{ site.author.avatar | relative_url }}"
           alt="{{ site.author.name }}" width="896" height="1200" fetchpriority="high" decoding="async">
      <div>
        <h1 id="hello">{{ page.hello }}</h1>
        <p>{{ page.introduction | newline_to_br }}</p>
        <nav class="personal-links" aria-label="Main navigation">
          <a href="{{ '/research/' | relative_url }}">Research ↗</a>
          <a href="{{ '/blog/' | relative_url }}">Writing ↗</a>
          <a href="mailto:{{ site.author.email }}">Let’s connect ↗</a>
        </nav>
      </div>
    </section>
    {% include terminal.html %}
  </main>
  <footer class="personal-footer">
    <span>{{ site.author.name }}</span>
    <nav aria-label="Social links">
      <a href="https://github.com/{{ site.author.github }}" rel="me noopener">GitHub ↗</a>
      <a href="https://www.linkedin.com/in/{{ site.author.linkedin }}" rel="me noopener">LinkedIn ↗</a>
    </nav>
  </footer>
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/terminal.js' | relative_url }}" defer></script>
</body>
</html>
