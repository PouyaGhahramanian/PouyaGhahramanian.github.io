{%- comment -%}
Responsive YouTube embed. Uses youtube-nocookie and lazy loading so a post that
merely mentions a video does not ship a tracker on first paint.
{%- endcomment -%}
<div class="video-embed">
  <iframe src="https://www.youtube-nocookie.com/embed/{{ include.id }}"
          title="{{ include.title | default: 'Embedded video' }}"
          loading="lazy"
          referrerpolicy="strict-origin-when-cross-origin"
          allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen></iframe>
</div>
